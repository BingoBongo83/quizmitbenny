{% extends "base.html" %}
{% block title %}Quiz – Login{% endblock %}
{% block content %}
<div class="login-box">
  <h1>Quiz</h1>
  <form method="post" action="/login">
    <input type="password" name="password" placeholder="Moderator-Passwort" autofocus>
    <button class="primary" type="submit">Anmelden</button>
  </form>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
</div>
{% endblock %}
